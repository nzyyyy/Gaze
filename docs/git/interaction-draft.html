              typeof data === "object" &amp;&amp;

        id = decodeURIComponent(href.slice(1));

        &lt;header class="gz-topbar"&gt;&lt;span class="gz-brand"&gt;&lt;i data-lucide="book-open" aria-hidden="true"&gt;&lt;/i&gt;Gaze&lt;/span&gt;&lt;span class="gz-top-context"&gt;Gaze / src / App.tsx&lt;/span&gt;&lt;/header&gt;
        &lt;div class="gz-body"&gt;
          &lt;nav class="gz-rail" aria-label="侧栏视图"&gt;
            &lt;button type="button" data-action="editor" aria-label="项目文件" data-tooltip="项目文件"&gt;&lt;i data-lucide="files" aria-hidden="true"&gt;&lt;/i&gt;&lt;/button&gt;
            &lt;button type="button" data-action="search" aria-label="全局搜索" data-tooltip="全局搜索"&gt;&lt;i data-lucide="search" aria-hidden="true"&gt;&lt;/i&gt;&lt;/button&gt;
            &lt;button type="button" data-action="symbols" aria-label="符号与大纲" data-tooltip="符号与大纲"&gt;&lt;i data-lucide="boxes" aria-hidden="true"&gt;&lt;/i&gt;&lt;/button&gt;
            &lt;button type="button" class="gz-on" data-action="git" aria-label="Git 管理" data-tooltip="Git 管理"&gt;&lt;i data-lucide="git-branch" aria-hidden="true"&gt;&lt;/i&gt;&lt;/button&gt;
          &lt;/nav&gt;
          &lt;aside class="gz-side" aria-label="Git 侧栏"&gt;
            &lt;div class="gz-project"&gt;&lt;strong&gt;Gaze&lt;/strong&gt;&lt;p&gt;当前项目 · 整个仓库&lt;/p&gt;&lt;button type="button" class="gz-branch" data-action="branches"&gt;&lt;span&gt;⑂ &lt;span data-branch-name&gt;main&lt;/span&gt;&lt;/span&gt;&lt;span&gt;⌄&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;
            &lt;div class="gz-project-tree"&gt;&lt;p&gt;⌄ Gaze&lt;/p&gt;&lt;p&gt;　⌄ src&lt;/p&gt;&lt;p&gt;　　App.tsx&lt;/p&gt;&lt;p&gt;　　styles.css&lt;/p&gt;&lt;p&gt;　⌄ src-tauri&lt;/p&gt;&lt;p&gt;　　Cargo.toml&lt;/p&gt;&lt;p class="gz-muted"&gt;README.md&lt;/p&gt;&lt;/div&gt;
            &lt;div class="gz-side-content"&gt;
              &lt;nav class="gz-navigation" aria-label="Git 视图"&gt;&lt;button type="button" data-view="changes" aria-pressed="true"&gt;更改&lt;/button&gt;&lt;button type="button" data-view="history" aria-pressed="false"&gt;历史&lt;/button&gt;&lt;button type="button" data-view="branches" aria-pressed="false"&gt;分支&lt;/button&gt;&lt;button type="button" data-view="stash" aria-pressed="false"&gt;Stash&lt;/button&gt;&lt;/nav&gt;
              &lt;div class="gz-list"&gt;&lt;div class="gz-group"&gt;正在读取示例更改…&lt;/div&gt;&lt;/div&gt;
              &lt;div class="gz-commit-box"&gt;&lt;label&gt;提交说明&lt;textarea class="gz-message" placeholder="描述这次修改…" aria-label="提交说明"&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;button type="button" class="gz-primary gz-commit" data-action="commit" disabled&gt;提交 1 个已暂存文件&lt;/button&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/aside&gt;
          &lt;main class="gz-main"&gt;
            &lt;div class="gz-tabs"&gt;&lt;button type="button" data-action="editor" aria-pressed="false"&gt;App.tsx&lt;/button&gt;&lt;button type="button" data-action="git" class="gz-git-tab" aria-pressed="true"&gt;Git · App.tsx&lt;/button&gt;&lt;/div&gt;
            &lt;div class="gz-sync"&gt;&lt;span class="gz-sync-label"&gt;origin/main · &lt;span data-ahead&gt;↑ 2&lt;/span&gt; ↓ 0&lt;/span&gt;&lt;button type="button" class="gz-outline" data-action="fetch"&gt;Fetch&lt;/button&gt;&lt;button type="button" class="gz-outline" data-action="pull"&gt;Pull&lt;/button&gt;&lt;button type="button" class="gz-outline" data-action="push"&gt;Push ↑2&lt;/button&gt;&lt;/div&gt;
            &lt;div class="gz-workspace"&gt;&lt;div class="gz-canvas"&gt;&lt;h3&gt;App.tsx&lt;/h3&gt;&lt;p class="gz-muted"&gt;未暂存 · 工作区 ↔ 索引&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;/main&gt;
        &lt;/div&gt;
        &lt;div class="gz-feedback" role="status" aria-live="polite"&gt;已读取仓库状态 · 上次 Fetch：5 分钟前&lt;/div&gt;
        &lt;footer class="gz-footer"&gt;&lt;button type="button" data-action="branches"&gt;⑂ &lt;span data-branch-name&gt;main&lt;/span&gt;&lt;/button&gt;&lt;span&gt;自动保存&lt;/span&gt;&lt;span&gt;UTF-8&lt;/span&gt;&lt;span style="margin-left:auto"&gt;Git 差异只读&lt;/span&gt;&lt;button type="button" data-action="terminal"&gt;终端&lt;/button&gt;&lt;/footer&gt;
        &lt;div class="gz-modal-layer" hidden&gt;&lt;section class="gz-dialog" role="dialog" aria-modal="true" aria-label="操作确认"&gt;&lt;/section&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;
    &lt;section data-variant="独立 Git 工作区" aria-label="独立 Git 工作区方案" hidden&gt;&lt;/section&gt;
  &lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;gaze-git-draft&#x27;);
  const first = root.querySelector(&#x27;.gz-window&#x27;);
  const alternate = first.cloneNode(true);
  alternate.dataset.layout = &#x27;dedicated&#x27;;
  alternate.classList.add(&#x27;gz-dedicated&#x27;);
  alternate.querySelector(&#x27;.gz-git-tab&#x27;).textContent = &#x27;Git · Gaze&#x27;;
  const dock = document.createElement(&#x27;div&#x27;);
  dock.className = &#x27;gz-dock&#x27;;
  const workspace = alternate.querySelector(&#x27;.gz-workspace&#x27;);
  dock.append(alternate.querySelector(&#x27;.gz-side-content&#x27;), alternate.querySelector(&#x27;.gz-canvas&#x27;));
  workspace.append(dock);
  root.querySelectorAll(&#x27;[data-variant]&#x27;)[1].append(alternate);
  root.querySelectorAll(&#x27;button&#x27;).forEach(button =&gt; button.classList.add(&#x27;cursor-interaction&#x27;));
  const escape = value =&gt; String(value).replace(/[&amp;&lt;&gt;"&#x27;]/g, ch =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;"&#x27;:&#x27;&amp;quot;&#x27;,"&#x27;":&#x27;&amp;#39;&#x27;}[ch]));
  const saved = window.openai?.widgetState;
  const initialFiles = () =&gt; [
    {name:&#x27;App.tsx&#x27;,path:&#x27;src/App.tsx&#x27;,staged:0,unstaged:2,mark:&#x27;M&#x27;},
    {name:&#x27;styles.css&#x27;,path:&#x27;src/styles.css&#x27;,staged:0,unstaged:1,mark:&#x27;M&#x27;},
    {name:&#x27;README.md&#x27;,path:&#x27;README.md&#x27;,staged:1,unstaged:0,mark:&#x27;M&#x27;}
  ];
  const histories = [
    {message:&#x27;feat: add Git entry to sidebar&#x27;,sha:&#x27;a1c8f23&#x27;,who:&#x27;nzyyyy · 12 分钟前&#x27;,file:&#x27;src/App.tsx&#x27;},
    {message:&#x27;fix: preserve editor state on project switch&#x27;,sha:&#x27;7bd42e0&#x27;,who:&#x27;nzyyyy · 1 小时前&#x27;,file:&#x27;src/App.tsx&#x27;},
    {message:&#x27;feat: add integrated terminal&#x27;,sha:&#x27;3f06b91&#x27;,who:&#x27;nzyyyy · 昨天&#x27;,file:&#x27;src/components/TerminalPanel.tsx&#x27;}
  ];
  const controllers = [];
  root.querySelectorAll(&#x27;.gz-window&#x27;).forEach((win, index) =&gt; {
    const canvas = win.querySelector(&#x27;.gz-canvas&#x27;);
    const list = win.querySelector(&#x27;.gz-list&#x27;);
    const commitBox = win.querySelector(&#x27;.gz-commit-box&#x27;);
    const message = win.querySelector(&#x27;.gz-message&#x27;);
    const commit = win.querySelector(&#x27;.gz-commit&#x27;);
    const feedback = win.querySelector(&#x27;.gz-feedback&#x27;);
    const modal = win.querySelector(&#x27;.gz-modal-layer&#x27;);
    const dialog = win.querySelector(&#x27;.gz-dialog&#x27;);
    const state = {view:&#x27;changes&#x27;,branch:&#x27;main&#x27;,files:initialFiles(),path:&#x27;src/App.tsx&#x27;,side:&#x27;unstaged&#x27;,history:0,choice:&#x27;&#x27;,ahead:2};
    const stored = saved?.privateContent?.[index];
    if(stored &amp;&amp; [&#x27;changes&#x27;,&#x27;history&#x27;,&#x27;branches&#x27;,&#x27;stash&#x27;].includes(stored.view)) state.view=stored.view;
    let returnFocus = null;
    let confirmAction = null;
    const announce = text =&gt; { feedback.textContent=text; };
    const remember = () =&gt; {
      if(window.openai?.setWidgetState) window.openai.setWidgetState({modelContent:{layout:win.dataset.layout,view:state.view},privateContent:Object.fromEntries(controllers.map((item,i)=&gt;[i,{view:item.state.view}]))}).catch(()=&gt;{});
    };
    const button = (text,action,extra=&#x27;&#x27;) =&gt; `&lt;button type="button" class="gz-outline cursor-interaction" data-action="${action}" ${extra}&gt;${text}&lt;/button&gt;`;
    const showModal = (title,body,label,onConfirm,danger=false) =&gt; {
      returnFocus = document.activeElement;
      confirmAction = onConfirm;
      dialog.innerHTML=`&lt;h3&gt;${escape(title)}&lt;/h3&gt;&lt;p&gt;${escape(body)}&lt;/p&gt;&lt;div class="gz-dialog-actions"&gt;${button(&#x27;取消&#x27;,&#x27;cancel&#x27;)}&lt;button type="button" class="${danger?&#x27;gz-outline gz-danger&#x27;:&#x27;gz-primary&#x27;} cursor-interaction" data-action="confirm"&gt;${escape(label)}&lt;/button&gt;&lt;/div&gt;`;
      dialog.setAttribute(&#x27;aria-label&#x27;,title);
      modal.hidden=false;
      dialog.querySelector(&#x27;[data-action="cancel"]&#x27;).focus();
    };
    const closeModal = () =&gt; { modal.hidden=true; confirmAction=null; if(returnFocus?.isConnected) returnFocus.focus(); else win.querySelector(&#x27;[data-action="git"]&#x27;).focus(); };
    const stats = () =&gt; { const count=state.files.filter(f=&gt;f.staged&gt;0).length; commit.textContent=`提交 ${count} 个已暂存文件`; commit.disabled=count===0 || !message.value.trim(); };
    const codeLines = (mode=&#x27;unstaged&#x27;) =&gt; mode===&#x27;readme&#x27;
      ? `&lt;div class="gz-code-line"&gt;&lt;span class="gz-number"&gt;1&lt;/span&gt;&lt;code&gt; # Gaze&lt;/code&gt;&lt;/div&gt;&lt;div class="gz-code-line gz-plus"&gt;&lt;span class="gz-number"&gt;2&lt;/span&gt;&lt;code&gt;+专注阅读与编辑，也能管理 Git。&lt;/code&gt;&lt;/div&gt;`
      : `&lt;div class="gz-code-line"&gt;&lt;span class="gz-number"&gt;62&lt;/span&gt;&lt;code&gt; type SidebarView =&lt;/code&gt;&lt;/div&gt;&lt;div class="gz-code-line gz-minus"&gt;&lt;span class="gz-number"&gt;&lt;/span&gt;&lt;code&gt;-  "files" | "search" | "symbols";&lt;/code&gt;&lt;/div&gt;&lt;div class="gz-code-line gz-plus"&gt;&lt;span class="gz-number"&gt;63&lt;/span&gt;&lt;code&gt;+  "files" | "search" | "symbols" | "git";&lt;/code&gt;&lt;/div&gt;&lt;div class="gz-code-line"&gt;&lt;span class="gz-number"&gt;64&lt;/span&gt;&lt;code&gt; &lt;/code&gt;&lt;/div&gt;&lt;div class="gz-code-line"&gt;&lt;span class="gz-number"&gt;65&lt;/span&gt;&lt;code&gt; const THEME_CYCLE = [&lt;/code&gt;&lt;/div&gt;&lt;div class="gz-code-line"&gt;&lt;span class="gz-number"&gt;66&lt;/span&gt;&lt;code&gt;   "system", "light", "dark"&lt;/code&gt;&lt;/div&gt;&lt;div class="gz-code-line"&gt;&lt;span class="gz-number"&gt;67&lt;/span&gt;&lt;code&gt; ];&lt;/code&gt;&lt;/div&gt;`;
    const renderList = () =&gt; {
      if(state.view!==&#x27;changes&#x27;) {
        const notes={history:[&#x27;提交历史&#x27;,&#x27;分支筛选不会切换工作区&#x27;,&#x27;全部分支 · 3 个示例提交&#x27;],branches:[&#x27;分支与引用&#x27;,&#x27;本地分支 3 · 远程分支 2&#x27;,&#x27;切换前检查未保存内容&#x27;],stash:[&#x27;暂存工作进度&#x27;,&#x27;stash@{0} · UI 调整&#x27;,&#x27;恢复前预览文件差异&#x27;],conflict:[&#x27;正在合并&#x27;,&#x27;1 个文件存在冲突&#x27;,&#x27;App.tsx · 1 个冲突块&#x27;],editor:[&#x27;项目文件&#x27;,&#x27;src / App.tsx&#x27;,&#x27;编辑停顿后自动保存&#x27;],search:[&#x27;全局搜索&#x27;,&#x27;搜索与 Git 使用同一项目上下文&#x27;,&#x27;&#x27;],symbols:[&#x27;符号与大纲&#x27;,&#x27;App · SidebarView&#x27;,&#x27;&#x27;]};
        const n=notes[state.view];
        list.innerHTML=`&lt;div class="gz-group"&gt;${n[0]}&lt;/div&gt;&lt;div style="padding:10px 14px"&gt;${n[1]}&lt;p class="gz-muted"&gt;${n[2]}&lt;/p&gt;${state.view===&#x27;branches&#x27;?button(&#x27;模拟冲突场景&#x27;,&#x27;conflict&#x27;):&#x27;&#x27;}&lt;/div&gt;`;
        return;
      }
      list.innerHTML=[&#x27;staged&#x27;,&#x27;unstaged&#x27;].map(side =&gt; {
        const files=state.files.filter(f=&gt;f[side]&gt;0);
        return `&lt;div class="gz-group"&gt;&lt;span&gt;${side===&#x27;staged&#x27;?&#x27;已暂存&#x27;:&#x27;未暂存&#x27;} · ${files.length}&lt;/span&gt;${files.length?button(side===&#x27;staged&#x27;?&#x27;全部取消&#x27;:&#x27;全部暂存&#x27;,side===&#x27;staged&#x27;?&#x27;unstage-all&#x27;:&#x27;stage-all&#x27;):&#x27;&#x27;}&lt;/div&gt;${files.map(f=&gt;`&lt;div class="gz-file ${state.path===f.path&amp;&amp;state.side===side?&#x27;gz-selected&#x27;:&#x27;&#x27;}"&gt;&lt;span class="gz-mark"&gt;${f.mark}&lt;/span&gt;&lt;button type="button" class="gz-name cursor-interaction" data-file="${f.path}" data-side="${side}"&gt;${f.name}&lt;/button&gt;&lt;button type="button" class="gz-stage cursor-interaction" data-toggle="${f.path}" data-side="${side}" aria-label="${side===&#x27;staged&#x27;?&#x27;取消暂存&#x27;:&#x27;暂存&#x27;} ${f.name}"&gt;${side===&#x27;staged&#x27;?&#x27;−&#x27;:&#x27;+&#x27;}&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;)}${files.length?&#x27;&#x27;:&#x27;&lt;div class="gz-muted" style="padding:6px 14px"&gt;没有文件&lt;/div&gt;&#x27;}`;
      }).join(&#x27;&#x27;);
    };
    const renderChanges = () =&gt; {
      const file=state.files.find(f=&gt;f.path===state.path);
      if(!file || (!file.staged&amp;&amp;!file.unstaged)) { canvas.innerHTML=&#x27;&lt;h3&gt;工作区已更新&lt;/h3&gt;&lt;p class="gz-muted"&gt;从左侧选择文件查看差异。&lt;/p&gt;&#x27;; return; }
      if(!file[state.side]) state.side=file.unstaged?&#x27;unstaged&#x27;:&#x27;staged&#x27;;
      const sides=file.staged&amp;&amp;file.unstaged?[&#x27;staged&#x27;,&#x27;unstaged&#x27;]:[state.side];
      const diffCode = side =&gt; {
        if(file.path===&#x27;README.md&#x27;) return codeLines(&#x27;readme&#x27;);
        if(file.path===&#x27;src/styles.css&#x27;) return &#x27;&lt;div class="gz-code-line gz-plus"&gt;&lt;span class="gz-number"&gt;128&lt;/span&gt;&lt;code&gt;+.git-panel { min-width: 0; }&lt;/code&gt;&lt;/div&gt;&#x27;;
        if(side===&#x27;unstaged&#x27;&amp;&amp;file.staged) return &#x27;&lt;div class="gz-code-line gz-plus"&gt;&lt;span class="gz-number"&gt;12&lt;/span&gt;&lt;code&gt;+import { GitBranch } from "lucide-react";&lt;/code&gt;&lt;/div&gt;&#x27;;
        return codeLines();
      };
      canvas.innerHTML=`&lt;div class="gz-content-title"&gt;&lt;h3&gt;${escape(file.name)}&lt;/h3&gt;${button(&#x27;在编辑器打开&#x27;,&#x27;editor&#x27;)}&lt;/div&gt;&lt;div class="gz-filepath gz-mono"&gt;${escape(file.path)} · ${file.staged&amp;&amp;file.unstaged?&#x27;部分暂存&#x27;:&#x27;差异只读&#x27;}&lt;/div&gt;${sides.map(side=&gt;`&lt;div class="gz-side-label"&gt;&lt;strong&gt;${side===&#x27;staged&#x27;?&#x27;已暂存&#x27;:&#x27;未暂存&#x27;}&lt;/strong&gt;&lt;span class="gz-muted"&gt;${side===&#x27;staged&#x27;?&#x27;HEAD ↔ 索引&#x27;:&#x27;索引 ↔ 工作区&#x27;}&lt;/span&gt;&lt;span class="gz-spacer"&gt;&lt;/span&gt;${button(side===&#x27;staged&#x27;?&#x27;取消暂存此块&#x27;:&#x27;暂存此块&#x27;,side===&#x27;staged&#x27;?&#x27;unstage-hunk&#x27;:&#x27;stage-hunk&#x27;)}${side===&#x27;unstaged&#x27;?button(&#x27;丢弃&#x27;,&#x27;discard&#x27;):&#x27;&#x27;}&lt;/div&gt;&lt;div class="gz-diff"&gt;${diffCode(side)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;p class="gz-muted" style="font-size:12px;margin:15px 0 0"&gt;提交只包含索引中的修改。暂存后继续编辑的内容会留在工作区。&lt;/p&gt;`;
    };
    const renderHistory = () =&gt; {
      const item=histories[state.history];
      canvas.innerHTML=`&lt;div class="gz-content-title"&gt;&lt;h3&gt;提交历史&lt;/h3&gt;&lt;label class="gz-muted"&gt;范围 &lt;select class="gz-history-filter" aria-label="历史分支筛选" style="color:var(--gz-ink);background:var(--gz-raised);border:1px solid var(--gz-line);border-radius:4px;padding:4px"&gt;&lt;option&gt;全部分支&lt;/option&gt;&lt;option&gt;main&lt;/option&gt;&lt;option&gt;feat/git&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;${histories.map((h,i)=&gt;`&lt;button type="button" class="gz-history-row cursor-interaction" data-history="${i}" aria-pressed="${i===state.history}"&gt;&lt;span class="gz-node" aria-hidden="true"&gt;●&lt;/span&gt;&lt;span&gt;${h.message}&lt;small&gt;${h.who}${i===0?&#x27; · main · HEAD&#x27;:&#x27;&#x27;}&lt;/small&gt;&lt;/span&gt;&lt;span class="gz-mono gz-muted"&gt;${h.sha}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;div class="gz-revision"&gt;&lt;strong&gt;${item.message}&lt;/strong&gt;&lt;p class="gz-muted gz-mono"&gt;${item.sha} · ${item.who}&lt;/p&gt;${button(item.file+&#x27;　+4 −1&#x27;,&#x27;revision&#x27;)}&lt;div class="gz-revision-diff" hidden&gt;&lt;div class="gz-side-label"&gt;提交差异 · 只读&lt;/div&gt;&lt;div class="gz-diff"&gt;${codeLines()}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`;
    };
    const renderBranches = () =&gt; {
      canvas.innerHTML=`&lt;div class="gz-content-title"&gt;&lt;h3&gt;分支&lt;/h3&gt;${button(&#x27;新建分支&#x27;,&#x27;create-branch&#x27;)}&lt;/div&gt;&lt;p class="gz-muted"&gt;当前：${escape(state.branch)} · origin/main&lt;/p&gt;${[&#x27;main&#x27;,&#x27;feat/git&#x27;,&#x27;fix/search&#x27;].map(b=&gt;`&lt;div class="gz-branch-row"&gt;&lt;span class="gz-mono"&gt;⑂ ${b}&lt;/span&gt;${b===state.branch?&#x27;&lt;span class="gz-add"&gt;当前分支&lt;/span&gt;&#x27;:button(&#x27;切换&#x27;,&#x27;switch&#x27;,`data-target="${b}"`)}${button(&#x27;比较&#x27;,&#x27;compare&#x27;,`data-target="${b}"`)}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;div style="margin-top:20px"&gt;${button(&#x27;模拟合并冲突场景&#x27;,&#x27;conflict&#x27;)}&lt;/div&gt;&lt;p class="gz-muted" style="font-size:12px"&gt;切换会先处理未保存内容；有冲突的本地修改不会被覆盖。&lt;/p&gt;`;
    };
    const renderConflict = () =&gt; {
