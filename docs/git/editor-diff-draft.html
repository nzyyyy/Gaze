<div id="gaze-diff-draft" class="viz-dotted-background" lang="zh-CN">
  <div class="demo-controls" aria-label="切换演示场景">
    <span>示例</span>
    <button type="button" data-case="0" aria-pressed="true">修改</button>
    <button type="button" data-case="1" aria-pressed="false">新增</button>
    <button type="button" data-case="2" aria-pressed="false">删除</button>
  </div>
  <section class="app-window" aria-label="Gaze 编辑器">
    <div class="tab-strip" aria-label="编辑器标签页">
      <button class="app-tab" type="button" data-action="editor" aria-current="page">
        client.ts
      </button>
      <button class="app-tab" type="button" data-action="full" hidden>对比 · client.ts</button>
    </div>
    <div class="editor-pane">
      <div class="file-path">src / <strong>client.ts</strong></div>
      <div class="source" aria-label="当前文件"></div>
      <section class="change-popover" aria-label="当前改动块">
        <header class="diff-toolbar">
          <div class="toolbar-title">
            <span class="status-icon" aria-hidden="true"></span>
            <strong data-field="title" aria-live="polite"></strong>
          </div>
          <div class="toolbar-actions">
            <button class="quiet-btn" type="button" data-action="wrap" aria-pressed="true">
              自动换行
            </button>
            <button class="icon-btn" type="button" data-action="close" aria-label="关闭浮层">
              ×
            </button>
          </div>
        </header>
        <div class="preview-scroll" aria-label="改动内容"></div>
        <footer class="diff-footer">
          <button class="quiet-btn revert" type="button" disabled title="样式演示">
            撤销此更改
          </button>
          <button class="open-btn" type="button" data-action="full">
            打开完整对比 <span aria-hidden="true">↗</span>
          </button>
        </footer>
      </section>
    </div>
    <section class="full-pane" aria-label="完整文件对比" hidden>
      <header class="diff-toolbar full-toolbar">
        <div class="toolbar-title">
          <strong>src/client.ts</strong>
          <span class="block-position" aria-live="polite"></span>
        </div>
        <div class="toolbar-actions">
          <button class="quiet-btn" type="button" data-action="wrap" aria-pressed="true">
            自动换行
          </button>
          <button class="quiet-btn" type="button" data-action="layout" aria-pressed="false">
            上下对比
          </button>
          <button
            class="icon-btn"
            type="button"
            data-action="prev"
            aria-label="上一处改动"
            title="上一处改动"
          >
            ↑
          </button>
          <button
            class="icon-btn"
            type="button"
            data-action="next"
            aria-label="下一处改动"
            title="下一处改动"
          >
            ↓
          </button>
        </div>
      </header>
      <div class="full-scroll" aria-label="文件内容"></div>
    </section>
  </section>
</div>

<style>

<script>
  (() => {
    const root = document.getElementById("gaze-diff-draft");
    const find = (selector) => root.querySelector(selector);
    const fileStart = [
      'import { createClient } from "./http";',
      "",
      'const service = "catalog";',
      "",
      "export const requestOptions = {",
      '  method: "GET",',
      '  cache: "no-store",',
    ];
    const blocks = [
      {
        tone: "modify",
        symbol: "~",
        label: "修改",
        oldStart: 8,
        newStart: 8,
        old: [
          "  timeoutMs: [3000],",
          "  retry: [1],",
          '  route: "/api/[v1]/catalog/items?include=inventory,pricing,shipping,availability",',
        ],
        current: [
          "  timeoutMs: [8000],",
          "  retry: [3],",
          '  route: "/api/[v2]/catalog/items?include=inventory,pricing,shipping,availability",',
        ],
        after: ['  headers: { accept: "application/json" },'],
      },
      {
        tone: "insert",
        symbol: "+",
        label: "新增",
        oldStart: 12,
        newStart: 12,
        old: [],
        current: ["  telemetry: true,", "  maxConnections: 8,"],
        after: ['  transport: "http1",'],
      },
      {
        tone: "delete",
        symbol: "−",
        label: "删除",
        oldStart: 13,
        newStart: 15,
        old: ["  legacyCache: true,"],
        current: [],
        after: ["};", "", "export const client = createClient(service, requestOptions);"],
      },
    ];
    const popover = find(".change-popover");
    const fullPane = find(".full-pane");
    const fullScroll = find(".full-scroll");
    const editor = find(".editor-pane");
    const editorTab = find(".app-tab[data-action=editor]");
    const fullTab = find(".app-tab[data-action=full]");
    let selected = 0;
    let opened = true;
    let full = false;
    let wrap = true;
    let unified = false;

    const escapeHtml = (text) =>
      text.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    function code(text, showMarks) {
      return escapeHtml(text).replace(
        /\[([^\]]+)\]|\b(export|import|from|const)\b|"[^"\[]*(?:\[[^\]]+\][^"\[]*)*"|\b(?:true|false|\d+)\b/g,
        (token, range, keyword) => {
          if (range) return showMarks ? `<mark>${range}</mark>` : range;
          if (token.includes("[")) {
            token = token.replace(/\[([^\]]+)\]/g, (_, part) =>
              showMarks ? `<mark>${part}</mark>` : part,
            );
          }
          return `<span class="${keyword ? "keyword" : "literal"}">${token}</span>`;
        },
      );
    }

    function line(number, text, { tone = "", sign = "", gutter = "" } = {}) {
      return `<div class="${gutter ? "source-line" : "code-line"} ${tone}"><span class="line-number">${number}</span>${gutter || `<span class="marker">${sign}</span>`}<span class="code">${code(text, !gutter)}</span></div>`;
    }

    function changeLines(block, side) {
      const old = side === "old";
      return block[side].map((text, index) =>
        line((old ? block.oldStart : block.newStart) + index, text, {
          tone: block.tone === "modify" ? (old ? "modify-old" : "modify-new") : block.tone,
          sign: old ? "−" : "+",
        }),
      );
    }

    function renderSource() {
      const source = fileStart.map((text) => ({ text }));
      blocks.forEach((block, index) => {
        block.current.forEach((text) => source.push({ text, index }));
        block.after.forEach((text, offset) =>
          source.push({
            text,
            index: !block.current.length && offset === 0 ? index : undefined,
          }),
        );
      });
      find(".source").innerHTML = source
        .map(({ text, index }, number) => {
          const block = blocks[index];
          const numberOnScreen = number + 1;
          if (!block) return line(numberOnScreen, text);
          const gutter = `<button type="button" data-case="${index}" title="查看${block.label}" aria-label="第 ${numberOnScreen} 行，查看${block.label}">${block.tone === "delete" ? "▸" : ""}</button>`;
          return line(numberOnScreen, text, {
            tone: `${block.tone}${opened && selected === index ? " is-current" : ""}`,
            gutter,
          });
        })
        .join("");
    }

    function renderPreview() {
      const block = blocks[selected];
      const title =
        block.tone === "modify"
          ? `修改 ${block.current.length} 行`
          : `${block.label} ${Math.max(block.old.length, block.current.length)} 行`;
      find('[data-field="title"]').textContent = title;
      const icon = find(".status-icon");
      icon.className = `status-icon ${block.tone}`;
      icon.textContent = block.symbol;
      find(".preview-scroll").innerHTML = [
        ["old", "修改前 · HEAD"],
        ["current", "修改后 · 当前编辑器"],
      ]
        .map(([side, label]) => {
          const rows = changeLines(block, side);
          return rows.length
            ? `<div class="preview-side"><div class="side-label">${label}</div>${rows.join("")}</div>`
            : "";
        })
        .join("");
      find(".preview-scroll").scrollTop = 0;
      find(".preview-scroll").scrollLeft = 0;
    }

    function renderFull() {
      const pair = (before, after) =>
        `<div class="compare-pair">${before || '<div class="gap"></div>'}${after || '<div class="gap"></div>'}</div>`;
      const group = (html, index, css) =>
        `<div class="compare-block ${css} ${selected === index ? "current" : ""}" data-block="${index}">${html}</div>`;
      const context = (lines, before, after, split) =>
        lines
          .map((text, index) =>
            split
              ? pair(line(before + index, text), line(after + index, text))
              : line(after + index, text),
          )
          .join("");
      function file(split) {
        return (
          context(fileStart, 1, 1, split) +
          blocks
            .map((block, index) => {
              const old = changeLines(block, "old");
              const current = changeLines(block, "current");
              const rows = split
                ? Array.from({ length: Math.max(old.length, current.length) }, (_, row) =>
                    pair(old[row], current[row]),
                  )
                : [...old, ...current];
              return (
                group(rows.join(""), index, block.tone) +
                context(
                  block.after,
                  block.oldStart + old.length,
                  block.newStart + current.length,
                  split,
                )
              );
            })
            .join("")
        );
      }
      fullScroll.innerHTML = `<div class="split-comparison"><div class="full-labels"><span>HEAD</span><span>当前编辑器</span></div>${file(true)}</div><div class="unified-comparison">${file(false)}</div>`;
      find(".block-position").textContent = `${selected + 1} / ${blocks.length} 处改动`;
      find('[data-action="prev"]').disabled = selected === 0;
      find('[data-action="next"]').disabled = selected === blocks.length - 1;
      const stack = unified || window.matchMedia?.("(max-width: 600px)").matches;
      const target = find(`.${stack ? "unified" : "split"}-comparison .compare-block.current`);
      fullScroll.scrollTop +=
        target.getBoundingClientRect().top - fullScroll.getBoundingClientRect().top - 46;
    }

    function render() {
      editor.hidden = full;
      popover.hidden = !opened;
      fullPane.hidden = !full;
      fullTab.hidden = fullTab.hidden && !full;
      editorTab.setAttribute("aria-current", full ? "false" : "page");
      fullTab.setAttribute("aria-current", full ? "page" : "false");
      root.classList.toggle("no-wrap", !wrap);
      root.classList.toggle("is-unified", unified);
      find('[data-action="layout"]').setAttribute("aria-pressed", String(unified));
      root
        .querySelectorAll('[data-action="wrap"]')
        .forEach((button) => button.setAttribute("aria-pressed", String(wrap)));
      root
        .querySelectorAll(".demo-controls [data-case]")
        .forEach((button) =>
          button.setAttribute("aria-pressed", String(Number(button.dataset.case) === selected)),
        );
      if (full) renderFull();
      else {
        renderSource();
        if (opened) renderPreview();
      }
    }

    root.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.case !== undefined) {
        selected = Number(button.dataset.case);
        opened = true;
        render();
        if (button.closest(".source")) find('.change-popover [data-action="wrap"]').focus();
        return;
      }
      switch (button.dataset.action) {
        case "editor":
          full = false;
          break;
        case "full":
          full = true;
          opened = false;
          break;
        case "close":
          opened = false;
          break;
        case "wrap":
          wrap = !wrap;
          break;
        case "layout":
          unified = !unified;
          break;
        case "prev":
          selected -= 1;
          break;
        case "next":
          selected += 1;
          break;
        default:
          return;
      }
      render();
      if (button.dataset.action === "full") fullTab.focus();
      if (button.dataset.action === "editor") editorTab.focus();
      if (button.dataset.action === "close") find(`.source [data-case="${selected}"]`)?.focus();
      if (button.disabled) fullTab.focus();
    });

    root.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (full) editorTab.click();
      else if (opened) find('[data-action="close"]').click();
    });

    render();
  })();
</script>
